[project]
name = "fast-whisper-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John Kristan Torremocha", email = "torremocha.johnkristan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.25.1.1",
]

[project.optional-dependencies]
train = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "evaluate>=0.4.0",
    "jiwer>=3.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "ctranslate2>=4.0.0",
    "pydub>=0.25.0",
]

[project.scripts]
fast-whisper-app = "fast_whisper_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
